server:
  port: 8080

spring:
  application:
    name: ai-interview
  autoconfigure:
    # 系统只使用 JWT + 数据库 RBAC，不创建无关的内存用户和随机开发密码。
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_interview}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
      filter:
        stat:
          enabled: true
          slow-sql-millis: 1000
          log-slow-sql: true
        wall:
          enabled: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800

interview:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # Base64 编码的 32 字节主密钥，用于 AES-256-GCM 加密数据库中的 AI API Key。
    ai-config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY}
    bootstrap-admin:
      username: ${RBAC_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${RBAC_BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${RBAC_BOOTSTRAP_ADMIN_EMAIL:}
      nickname: ${RBAC_BOOTSTRAP_ADMIN_NICKNAME:系统管理员}
  file:
    upload-dir: ./uploads
    base-url: /files

ai:
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      api-endpoint: https://api.deepseek.com/v1
      model-name: deepseek-chat
      timeout-seconds: 600
    xiaomi:
      api-key: ${XIAOMI_API_KEY}
      api-endpoint: https://token-plan-cn.xiaomimimo.com
      model-name: mimo-v2.5-pro
    funasr:
      api-key: ${FUNASR_API_KEY:your_funasr_api_key}
      api-endpoint: ${FUNASR_API_ENDPOINT:https://dashscope.aliyuncs.com/api/v1}
      model-name: ${FUNASR_MODEL_NAME:fun-asr}
  funasr:
    # 开发环境默认使用 DashScope 临时上传；生产环境可切换为 SIGNED_PUBLIC_URL。
    file-source-mode: ${FUNASR_FILE_SOURCE_MODE:TEMPORARY_UPLOAD}
    public-base-url: ${FUNASR_PUBLIC_BASE_URL:}
    file-url-secret: ${FUNASR_FILE_URL_SECRET:your_funasr_file_url_secret}
    file-url-ttl-seconds: ${FUNASR_FILE_URL_TTL_SECONDS:10800}
    diarization-enabled: ${FUNASR_DIARIZATION_ENABLED:true}
    speaker-count: ${FUNASR_SPEAKER_COUNT:}
    max-diarization-duration-minutes: ${FUNASR_MAX_DIARIZATION_DURATION_MINUTES:120}
    poll-interval-seconds: ${FUNASR_POLL_INTERVAL_SECONDS:5}
    task-timeout-seconds: ${FUNASR_TASK_TIMEOUT_SECONDS:10800}
    ffmpeg-path: ${FUNASR_FFMPEG_PATH:ffmpeg}

async:
  core-pool-size: 4
  max-pool-size: 8
  queue-capacity: 100
  thread-name-prefix: interview-async-

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.interview: debug
    root: info
